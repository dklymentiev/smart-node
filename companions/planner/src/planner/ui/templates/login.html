{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto bg-white border rounded-lg p-6 shadow-sm">
  <h1 class="text-xl font-semibold mb-4">Sign in to Planner</h1>
  {% if request.query_params.get("error") %}
  <div class="mb-4 rounded bg-rose-50 border border-rose-200 px-3 py-2 text-sm text-rose-700">
    Invalid or unknown API key.
  </div>
  {% endif %}
  <form method="post" action="/ui/login" class="space-y-4">
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1" for="key">API key</label>
      <input id="key" name="key" type="password" autocomplete="off"
             class="w-full rounded border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-400"
             placeholder="planner_..." required>
      <p class="mt-1 text-xs text-slate-500">
        Use the root API key printed at first start, or one issued via <code>/api/v1/api-keys</code>.
      </p>
    </div>
    <button type="submit" class="w-full rounded bg-slate-900 text-white text-sm font-medium py-2 hover:bg-slate-800">Sign in</button>
  </form>
</div>
{% endblock %}
