{% if projects %}
<div class="bg-white border rounded-lg divide-y h-full">
  {% for p in projects %}
  <a href="/ui/projects/{{ p.slug }}"
     class="flex items-center gap-3 px-4 py-2.5 hover:bg-slate-50 transition">
    <span class="font-medium text-slate-900 truncate flex-1 min-w-0">
      {{ p.title }}
      <span class="text-xs text-slate-400 font-normal">{{ p.slug }}</span>
    </span>
    <span class="text-xs text-slate-500 shrink-0 whitespace-nowrap hidden sm:inline">
      {{ p.done }}/{{ p.total }}{% if p.active %} &middot; {{ p.active }} active{% endif %}
    </span>
    <div class="h-2 bg-slate-100 rounded-full overflow-hidden shrink-0 w-28 sm:w-40">
      <div class="h-full bg-slate-700" style="width: {{ p.pct }}%"></div>
    </div>
    <span class="font-mono text-xs text-slate-700 shrink-0 w-9 text-right">{{ p.pct }}%</span>
  </a>
  {% endfor %}
</div>
{% else %}
<div class="bg-white border rounded-lg p-8 h-full text-center text-sm text-slate-500">
  No active projects yet. Create one via
  <code class="px-1 py-0.5 bg-slate-100 rounded">POST /api/v1/projects</code>
  or the CLI: <code class="px-1 py-0.5 bg-slate-100 rounded">planner project create</code>.
</div>
{% endif %}
