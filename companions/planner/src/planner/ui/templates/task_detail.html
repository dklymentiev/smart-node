{% extends "base.html" %}
{% block content %}
<section class="mb-6 flex items-baseline justify-between">
  <div>
    <p class="text-xs text-slate-400 mb-1">
      {% if project %}
      <a href="/ui/projects/{{ project.slug }}" class="hover:text-slate-700">{{ project.title }}</a>
      &raquo;
      {% endif %}
      <span class="font-mono">#{{ task.id }}</span>
    </p>
    <h1 class="text-2xl font-semibold tracking-tight">{{ task.title }}</h1>
  </div>
  <a href="/ui/" class="text-sm text-slate-500 hover:text-slate-900">&larr; Projects</a>
</section>

<div id="task-detail">
  {% include "_partials/task_detail.html" %}
</div>
{% endblock %}
