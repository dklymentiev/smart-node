<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0c">
<title>Admin: no connection</title>
<!-- What the installed admin panel shows when the node cannot be reached (sw.js). Self-contained: nothing else is
     kept offline. -->
<style>
  html, body { height:100%; margin:0; }
  body { background:#0a0a0c; color:#f2f2f0; font:15px/1.5 Inter, -apple-system, system-ui, sans-serif;
         display:grid; place-items:center; padding:24px; box-sizing:border-box; }
  main { max-width:340px; text-align:center; }
  h1 { font-size:18px; font-weight:600; margin:16px 0 8px; }
  p { color:#83838d; margin:0 0 20px; }
  button { background:#131419; color:#f2f2f0; border:1px solid #2a2b33; border-radius:8px;
           padding:10px 18px; font:inherit; cursor:pointer; }
</style>
</head>
<body>
<main>
  <svg width="40" height="40" viewBox="0 0 20 20" fill="#f2f2f0"><rect x="1" y="1" width="10" height="10"/><rect x="9" y="9" width="10" height="10"/></svg>
  <h1>The node cannot be reached</h1>
  <p>The admin panel needs the node's network. Check the connection, then try again.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
