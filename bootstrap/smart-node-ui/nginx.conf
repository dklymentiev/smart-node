server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The shared UI kit (tokens, base, components) from its one source, the
    # Studio, where it is served without a session for the first-run
    # page. The panel kept an old copy of two of its files and drew its own
    # buttons; one kit is the rule for every service UI (look audit, 2026-10-30).
    location /ui/ {
        proxy_pass http://host.docker.internal:8050/welcome/ui/;
        add_header Cache-Control "no-cache";
    }

    # The installable-app manifest: its own type, revalidated on every load.
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # Static assets — long cache, immutable on filename change.
    location /assets/ {
        # Un-versioned filenames: revalidate each load (ETag) so panel edits show immediately.
        add_header Cache-Control "no-cache";
    }

    # Runtime data snapshots (refreshed by sn-panel-data.sh) — never cache.
    location /data/ {
        add_header Cache-Control "no-store";
    }

    # Subdirectory routes: /messages/, /agents/, etc. -> index.html.
    # Pages revalidate on every load (ETag), as the assets do: with no header a
    # browser kept an edited page for up to a day, the old top bar included.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Sign out: Authum asks and signs out, with its own CSRF token. The pages
    # linked /api/auth.php?action=logout, a script this panel no longer has.
    location = /logout {
        set $proto $scheme;
        if ($http_x_forwarded_proto) { set $proto $http_x_forwarded_proto; }
        if ($host ~ ^[^.]+\.(.+)$) { return 302 $proto://auth.$1/?action=logout; }
        return 404;
    }

    location ~ /\.(git|env|bak) {
        deny all;
    }
}
