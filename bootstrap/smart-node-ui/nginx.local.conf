server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # LOCAL ONLY: proxy /api/* to the core-api backend container.
    # In production this is done by Traefik+Authum (which also injects Remote-User).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # The installable-app manifest: its own type, revalidated on every load.
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # Static assets — cache but always revalidate (ETag -> 304 when unchanged).
    # shell.js/shell.css have no content hash in the filename, so a long max-age
    # served a stale bundle for up to an hour after a rebuild. no-cache keeps the
    # 304 efficiency without ever serving a stale panel.
    location /assets/ {
        add_header Cache-Control "no-cache";
    }

    # Runtime data snapshots (normally rendered by sn-panel-data.sh).
    # Local: served from a mounted dir; missing files 404 -> pages show empty.
    location /data/ {
        add_header Cache-Control "no-store";
    }

    # Subdirectory routes: /agents/, /tools/, etc. -> their index.html.
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Sign out: Authum asks and signs out, with its own CSRF token. The pages
    # linked /api/auth.php?action=logout, a script this panel no longer has.
    location = /logout {
        set $proto $scheme;
        if ($http_x_forwarded_proto) { set $proto $http_x_forwarded_proto; }
        if ($host ~ ^[^.]+\.(.+)$) { return 302 $proto://auth.$1/?action=logout; }
        return 404;
    }

    location ~ /\.(git|env|bak) {
        deny all;
    }
}
